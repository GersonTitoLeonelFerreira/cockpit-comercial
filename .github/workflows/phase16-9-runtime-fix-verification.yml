name: Phase 16.9 Runtime Fix Verification

on:
  push:
    branches:
      - 'chatgpt/phase16-9-real-runtime-fix'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime-regate:
    name: Runtime real regression + package gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Real-history capture regression
        run: node --test app/extension/yolen-companion/tests/phase16-9-real-history-capture.test.mjs

      - name: Companion regression suite
        run: npm run test:companion

      - name: E3 DOM assertions
        run: node --test --test-force-exit app/extension/yolen-companion/tests/e3-dom/*.test.mjs

      - name: Stateful shadow wiring
        run: node --test app/extension/yolen-companion/tests/stateful-shadow-wiring.test.mjs

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build extension packages
        run: node app/extension/yolen-companion/scripts/build-package.mjs

      - name: Validate release candidate
        run: node app/extension/yolen-companion/scripts/validate-release-candidate.mjs

      - name: Git diff check
        run: git diff --check
