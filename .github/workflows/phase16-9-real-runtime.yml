name: Phase 16.9 Real Runtime Gate

on:
  push:
    branches:
      - chatgpt/phase16-9-real-runtime-fix

permissions:
  contents: read

jobs:
  real-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Real card history regression
        run: node --test app/extension/yolen-companion/tests/phase16-9-real-history-capture.test.mjs
      - name: Real seller responsibility regression
        run: node --conditions=react-server --import ./scripts/register-typescript-test-loader.mjs --test app/lib/companion/phase16-9-real-responsibility-regression.test.mjs
      - name: Full Companion suite
        run: npm run test:companion
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Package extension
        run: node app/extension/yolen-companion/scripts/build-package.mjs
      - name: Validate release candidate
        run: node app/extension/yolen-companion/scripts/validate-release-candidate.mjs
      - name: Diff check
        run: git diff --check HEAD^ HEAD
