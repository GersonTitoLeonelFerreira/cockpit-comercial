name: FASE 12A Control Master Validation

on:
  push:
    branches:
      - 'validation/phase12a-control-master-gates'

permissions:
  contents: read

jobs:
  combined-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run controlled FASE 12A gates
        shell: bash
        run: |
          set +e
          mkdir -p validation-artifacts

          BASE=369bccbc2da091b6a464f24d9ecea4f1e63cd123

          run_gate() {
            NAME="$1"
            shift
            echo "===== $NAME ====="
            bash -lc "$*" > "validation-artifacts/$NAME.log" 2>&1
            CODE=$?
            echo "$CODE" > "validation-artifacts/$NAME.exit"
            cat "validation-artifacts/$NAME.log"
            echo "===== $NAME EXIT $CODE ====="
            return 0
          }

          git diff --name-only "$BASE" HEAD > validation-artifacts/changed-files.txt
          git log --oneline --decorate --graph "$BASE"..HEAD > validation-artifacts/integration-log.txt

          run_gate diff-check "git diff --check $BASE HEAD"

          run_gate test-companion "npm run test:companion"

          run_gate typescript "npx tsc --noEmit -p ."

          CHANGED_LINTABLES="$(git diff --name-only "$BASE" HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' | tr '\n' ' ')"
          if [ -n "$CHANGED_LINTABLES" ]; then
            run_gate eslint "npx eslint $CHANGED_LINTABLES"
          else
            echo 0 > validation-artifacts/eslint.exit
            echo "No lintable changed files." > validation-artifacts/eslint.log
          fi

          run_gate f1b-isolation-16 "node --test app/extension/yolen-companion/tests/e3-dom/content-script-dom-lead-create-conversation-isolation.test.mjs"
          run_gate f1b-lead-automation-10 "node --test app/extension/yolen-companion/tests/lead-automation-flow.test.mjs"

          run_gate f2b-directed "node --conditions=react-server --import ./scripts/register-typescript-test-loader.mjs --test app/api/ai/apply-suggestion/route.test.mjs app/api/companion/apply-suggestion/route.test.mjs app/extension/yolen-companion/tests/content-script-apply-suggestion-confirmation.test.mjs app/extension/yolen-companion/tests/content-script-deletion-reason.test.mjs app/extension/yolen-companion/tests/message-mutations.test.mjs app/lib/companion/lead-seller-guidance-stage-continuity.test.mjs app/lib/server/companion-method-stage-store.test.mjs app/lib/companion/durable-memory-seed.test.mjs app/lib/companion/capture-ingestion.test.mjs app/lib/companion/phase12a-background-concurrency.test.mjs"
          run_gate f2b-db-contracts "node --test supabase/phase-tests/phase-12b-message-deletion-reason.test.mjs supabase/phase-tests/phase-12b-method-stage-state.test.mjs"

          run_gate f3-commercial-method "node --conditions=react-server --import ./scripts/register-typescript-test-loader.mjs --test app/admin/configuracao-comercial/*.test.mjs app/lib/commercial-config/*.test.mjs app/lib/server/commercial-method-*.test.mjs"

          run_gate e3-dom "node --test app/extension/yolen-companion/tests/e3-dom/*.test.mjs"

          run_gate build-extension "node app/extension/yolen-companion/scripts/build-package.mjs"
          run_gate validate-release-candidate "node app/extension/yolen-companion/scripts/validate-release-candidate.mjs"

          if [ -f dist/yolen-companion/build-summary.json ]; then
            cp dist/yolen-companion/build-summary.json validation-artifacts/build-summary.json
          fi
          if [ -f dist/yolen-companion/release-candidate-report.json ]; then
            cp dist/yolen-companion/release-candidate-report.json validation-artifacts/release-candidate-report.json
          fi

          {
            echo "FASE 12A gate exit codes"
            for f in validation-artifacts/*.exit; do
              printf "%s=" "$(basename "$f" .exit)"
              cat "$f"
            done
          } | tee validation-artifacts/summary.txt

          exit 0

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12a-control-master-validation
          path: validation-artifacts/
          retention-days: 14
          if-no-files-found: error
