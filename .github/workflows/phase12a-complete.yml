          deepAnalysisStatus: 'failed',
          deepAnalysisResult: null,
        }

        renderPanel()
        return
      }

      const delay =
        DEEP_ANALYSIS_POLL_DELAYS_MS[
          Math.min(
            attempt,
            DEEP_ANALYSIS_POLL_DELAYS_MS.length - 1,
          )
        ]

      attempt += 1

      deepAnalysisPollTimerId =
        window.setTimeout(runTick, delay)
    }

