function matches(row, filters) {
  return filters.every(({ column, value }) => row[column] === value)
}

function buildQueryClass(tables) {
  return class Query {
    constructor(table) {
      this.table = table
      this.filters = []
      this.maxRows = null
    }

    select() { return this }
    eq(column, value) {
      this.filters.push({ column, value })
      return this
    }
    limit(count) {
      this.maxRows = count
      return this
    }
    rows() {
      const rows = (tables[this.table] ?? []).filter((row) => matches(row, this.filters))
      return this.maxRows === null ? rows : rows.slice(0, this.maxRows)
    }
    maybeSingle() {
      const rows = this.rows()
      return Promise.resolve({
        data: rows.length === 1 ? rows[0] : rows[0] ?? null,
        error: null,
      })
    }
    then(resolve, reject) {
      return Promise.resolve({ data: this.rows(), error: null }).then(resolve, reject)
    }
  }
}

