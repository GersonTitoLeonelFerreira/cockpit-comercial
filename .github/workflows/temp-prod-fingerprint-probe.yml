name: TEMP Production Runtime Fingerprint Probe

on:
  pull_request:
    paths:
      - '.github/workflows/temp-prod-fingerprint-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query production fingerprint
        shell: bash
        run: |
          set +e
          URL="https://cockpit-comercial-vocn.vercel.app/api/diagnostics/runtime-fingerprint"

          curl -sS             --max-time 30             -D headers.txt             -o body.txt             "$URL"

          CURL_EXIT=$?

          {
            echo "url=$URL"
            echo "curl_exit=$CURL_EXIT"
            echo
            echo "=== HEADERS ==="
            cat headers.txt 2>/dev/null || true
            echo
            echo "=== BODY ==="
            cat body.txt 2>/dev/null || true
          } > probe-output.txt

          exit 0

      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: production-runtime-fingerprint-probe
          path: probe-output.txt
          if-no-files-found: error
