name: Companion Extension Release Engineering

# Escopo normal: D2/D3 da extensão. A branch de hotfix da ONDA 8 usa este
# workflow apenas como runner temporário porque o arquivo já é conhecido pela
# default branch. A alteração existe somente na branch de hotfix e será
# restaurada após os gates.
on:
  push:
    branches:
      - claude/onda8-hotfix-builder-text-editing
  pull_request:
    paths:
      - 'app/extension/yolen-companion/**'
      - '.github/workflows/companion-extension-release.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-validate:
    if: github.event_name != 'push'
    name: Build + validar Release Candidate (Chrome/Firefox × dev/prod)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências (determinístico via package-lock.json)
        run: npm ci

      - name: Rodar suíte de testes do Companion
        run: npm run test:companion

      - name: Gerar pacotes Chrome e Firefox (dev + prod)
        run: node app/extension/yolen-companion/scripts/build-package.mjs

      - name: Validar Release Candidate (D2/D3)
        run: node app/extension/yolen-companion/scripts/validate-release-candidate.mjs

      - name: Checar elegibilidade de loja dos pacotes PROD
        run: |
          node -e "
            const report = require('./dist/yolen-companion/release-candidate-report.json');
            const chrome = report.results['chrome-prod'];
            const firefox = report.results['firefox-prod'];
            console.log('Chrome PROD: ' + chrome.classification);
            console.log('Firefox PROD: ' + firefox.classification);
            const ok = chrome.classification === 'STORE_ELIGIBLE_CANDIDATE' && firefox.classification === 'STORE_ELIGIBLE_CANDIDATE';
            if (!ok) {
              console.error('Um ou ambos os pacotes PROD não estão tecnicamente prontos para submissão.');
              process.exit(1);
            }
            console.log('Tecnicamente preparados para submissão (não publicados, não aprovados pelas lojas).');
          "

      - name: git diff --check (espaços em branco / marcadores de conflito)
        run: git diff --check

      - name: Publicar artefatos de build para inspeção (CI apenas — não é publicação em loja)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yolen-companion-release-candidate-${{ github.run_number }}
          path: |
            dist/yolen-companion/*.zip
            dist/yolen-companion/build-summary.json
            dist/yolen-companion/release-candidate-report.json
          retention-days: 14
          if-no-files-found: warn

  onda8-builder-text-editing:
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/onda8-hotfix-builder-text-editing'
    name: ONDA 8 — hotfix edição de texto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: claude/onda8-hotfix-builder-text-editing
          fetch-depth: 0

      - name: Aplicar patch determinístico se necessário
        id: patch
        shell: bash
        run: |
          if grep -q "EditableLinesTextarea" app/admin/configuracao-comercial/CommercialMethodBuilder.tsx; then
            echo "patched=false" >> "$GITHUB_OUTPUT"
            echo "Hotfix já aplicado; seguindo para validação."
            exit 0
          fi

          python scripts/onda8-hotfix-builder-text-editing.py
          git diff --check

          git config user.name "Yolen Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/admin/configuracao-comercial/CommercialMethodBuilder.tsx \
            app/admin/configuracao-comercial/BuyerDecisionArchitecture.tsx \
            app/admin/configuracao-comercial/AssistedMethodConstruction.tsx \
            app/admin/configuracao-comercial/EditableLinesTextarea.tsx \
            app/admin/configuracao-comercial/commercial-method-builder-text-editing.test.mjs \
            app/lib/commercial-config/text-editing.ts
          git commit -m "fix(commercial-method-builder): preserve text editing during autosave"
          git push origin HEAD:claude/onda8-hotfix-builder-text-editing
          echo "patched=true" >> "$GITHUB_OUTPUT"

      - name: Configurar Node.js
        if: steps.patch.outputs.patched != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Instalar dependências
        if: steps.patch.outputs.patched != 'true'
        run: npm ci

      - name: Auditar interceptação de teclado
        if: steps.patch.outputs.patched != 'true'
        run: |
          grep -RInE "keydown|keyup|keypress|onKeyDown|onKeyUp|preventDefault|stopPropagation" app/admin/configuracao-comercial || true

      - name: Teste DOM + edição + autosave
        if: steps.patch.outputs.patched != 'true'
        run: node --conditions=react-server --import ./scripts/register-typescript-test-loader.mjs --test app/admin/configuracao-comercial/commercial-method-builder-text-editing.test.mjs

      - name: Suítes ONDA 8
        if: steps.patch.outputs.patched != 'true'
        run: |
          node --conditions=react-server --import ./scripts/register-typescript-test-loader.mjs --test \
            app/lib/commercial-config/commercial-method-builder.test.mjs \
            app/lib/commercial-config/commercial-method-builder-architecture.test.mjs \
            app/lib/server/commercial-method-builder.test.mjs \
            app/lib/commercial-config/assisted-method-construction.test.mjs \
            app/lib/commercial-config/assisted-method-construction-architecture.test.mjs \
            app/lib/commercial-config/buyer-decision-architecture.test.mjs \
            app/lib/server/commercial-method-construction.test.mjs \
            supabase/phase-tests/phase-8-commercial-method-builder.test.mjs \
            supabase/phase-tests/phase-8-assisted-method-construction.test.mjs

      - name: commercial-method-v2 regression
        if: steps.patch.outputs.patched != 'true'
        run: npm run test:companion-commercial-method-v2-validation

      - name: commercial-config admin regression
        if: steps.patch.outputs.patched != 'true'
        run: npm run test:companion-commercial-config-admin

      - name: TypeScript
        if: steps.patch.outputs.patched != 'true'
        run: npx tsc --noEmit

      - name: Build
        if: steps.patch.outputs.patched != 'true'
        run: npm run build
